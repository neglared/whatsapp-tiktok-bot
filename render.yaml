services:
  - type: web
    name: whatsapp-tiktok-bot
    runtime: docker
    plan: free
    region: virginia
    healthCheckPath: /
    envVars:
      - key: ACCESS_TOKEN
        sync: false
      - key: PHONE_NUMBER_ID
        sync: false
      - key: APP_SECRET
        sync: false
      - key: APP_ID
        sync: false
      - key: VERIFY_TOKEN
        sync: false
      - key: API_VERSION
        value: v23.0
      - key: MAX_MB
        value: "16"
      - key: DAILY_LIMIT
        value: "30"
      - key: MONTHLY_LIMIT
        value: "980"
      - key: SINGLE_MESSAGE
        value: "1"
